name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"      # once a day, 05:17 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab
                               # deliberately no `push` trigger — this job commits,
                               # and a push trigger would re-run it on its own commit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_stats.py
          python3 scripts/headings.py

      - name: commit if changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg hd-*.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no changes"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
